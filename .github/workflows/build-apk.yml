name: Build APK

# Builds the Android APK on GitHub's servers (free for public repos).
# Runs on every push to main, or manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test test/core test/widget test/audit_fields test/audit_money

      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.PGM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pgm.jks"
            echo "PGM_KEYSTORE_PATH=$RUNNER_TEMP/pgm.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::PGM_KEYSTORE_BASE64 secret not set. This APK uses a temporary key and cannot update an existing install."
          fi

      - name: Build release APK
        env:
          PGM_SIGNING_PASSWORD: ${{ secrets.PGM_SIGNING_PASSWORD }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PG-Manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish as "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PG Manager (latest build)
          prerelease: true
          make_latest: true
          body: |
            Built automatically from commit ${{ github.sha }}.
            Download **app-release.apk** below and open it on your Android phone.
            This build is signed with a debug key: fine for testing, not for the Play Store.
          files: build/app/outputs/flutter-apk/app-release.apk
